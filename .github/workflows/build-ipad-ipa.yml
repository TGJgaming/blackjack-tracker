name: Build iPad Tracker IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, ipados ]
    paths:
      - 'index.html'
      - 'companion/ipad/**'
      - '.github/workflows/build-ipad-ipa.yml'

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project & Build Unsigned iPadOS Archive
        working-directory: companion/ipad/ios-app
        run: |
          xcodegen generate
          xcodebuild \
            -project BlackjackTracker.xcodeproj \
            -scheme BlackjackTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package BlackjackTracker.ipa for Sideloadly / AltStore
        working-directory: companion/ipad/ios-app
        run: |
          rm -rf Payload BlackjackTracker.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BlackjackTracker.app Payload/
          for f in \
            Payload/BlackjackTracker.app/Info.plist \
            Payload/BlackjackTracker.app/index.html \
            Payload/BlackjackTracker.app/default_pack.js \
            Payload/BlackjackTracker.app/companion_engine.js \
            Payload/BlackjackTracker.app/PlugIns/BroadcastExtension.appex/Info.plist \
            Payload/BlackjackTracker.app/PlugIns/SafariKeepaliveExtension.appex/Info.plist \
            Payload/BlackjackTracker.app/PlugIns/SafariKeepaliveExtension.appex/manifest.json \
            Payload/BlackjackTracker.app/PlugIns/SafariKeepaliveExtension.appex/background.js
          do
            test -f "$f" || { echo "Missing expected bundle file: $f" >&2; exit 1; }
          done
          zip -qry BlackjackTracker.ipa Payload
          ls -lh BlackjackTracker.ipa

      - name: Upload BlackjackTracker.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackTracker-iPad-IPA
          path: companion/ipad/ios-app/BlackjackTracker.ipa
          if-no-files-found: error

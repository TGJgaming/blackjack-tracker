name: BlackjackTracker
options:
  bundleIdPrefix: com.tgjgaming
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2" # iPad (1,2 for Universal if desired)
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  BlackjackTracker:
    type: application
    platform: iOS
    sources:
      - path: BlackjackTracker
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: ../../../index.html
        buildPhase: resources
      - path: ../default_pack.js
        buildPhase: resources
      - path: ../companion_engine.js
        buildPhase: resources
      - path: ../companion_worker.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tgjgaming.blackjacktracker
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BlackjackTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: BlackjackTracker/BlackjackTracker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BroadcastExtension
        embed: true
      - target: SafariKeepaliveExtension
        embed: true

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: BlackjackTracker/SharedFrameRing.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tgjgaming.blackjacktracker.BroadcastExtension
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/BroadcastExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  SafariKeepaliveExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariKeepaliveExtension/SafariWebExtensionHandler.swift
      - path: SafariKeepaliveExtension/Resources/manifest.json
        buildPhase: resources
      - path: SafariKeepaliveExtension/Resources/background.js
        buildPhase: resources
      - path: SafariKeepaliveExtension/Resources/popup.html
        buildPhase: resources
      - path: SafariKeepaliveExtension/Resources/popup.js
        buildPhase: resources
      - path: SafariKeepaliveExtension/Resources/icon-48.png
        buildPhase: resources
      - path: SafariKeepaliveExtension/Resources/icon-96.png
        buildPhase: resources
      - path: SafariKeepaliveExtension/Resources/icon-128.png
        buildPhase: resources
      - path: SafariKeepaliveExtension/Resources/icon-256.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tgjgaming.blackjacktracker.SafariKeepaliveExtension
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SafariKeepaliveExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SafariKeepaliveExtension/SafariKeepaliveExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
